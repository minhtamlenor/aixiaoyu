name: Apply Live Voice input transport rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, 'Apply Live Voice input transport rebuild')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild microphone input path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("live_voice.py")
          s = p.read_text(encoding="utf-8")

          start = s.index("# ============================================================\n# MICROPHONE: MANUAL VAD")
          end = s.index("# ============================================================\n# RECEIVE LOOP", start)

          new_microphone = '''# ============================================================
# MICROPHONE: GEMINI AUTOMATIC VAD
# ============================================================
# The isolated microphone test proves that the sounddevice -> PCM -> Gemini
# transport and input transcription work. Keep this runtime path identical:
# continuously stream 16 kHz PCM and let Gemini Live own turn detection.

async def microphone_sender(session):
    global listen_ready, model_speaking
    loop = asyncio.get_running_loop()
    audio_queue = asyncio.Queue(maxsize=80)
    stopped = False

    def enqueue(data):
        if stopped or shutdown_requested:
            return
        try:
            audio_queue.put_nowait(data)
        except asyncio.QueueFull:
            try:
                audio_queue.get_nowait()
            except asyncio.QueueEmpty:
                pass
            try:
                audio_queue.put_nowait(data)
            except asyncio.QueueFull:
                pass

    def callback(indata, frames, time_info, status):
        if status:
            print("MIC:", status, flush=True)
        try:
            loop.call_soon_threadsafe(enqueue, bytes(indata))
        except Exception as e:
            print("⚠️ MIC callback lỗi:", repr(e), flush=True)

    try:
        device_info = sd.query_devices(MIC, "input")
        print(f"🎙️ MIC device {MIC}: {device_info['name']}", flush=True)
        print(f"🎙️ MIC channels={device_info['max_input_channels']} rate={INPUT_RATE} block={BLOCKSIZE}", flush=True)
    except Exception as e:
        print("⚠️ Không đọc được thông tin MIC:", repr(e), flush=True)

    with sd.RawInputStream(
        device=MIC,
        samplerate=INPUT_RATE,
        channels=CHANNELS,
        dtype="int16",
        blocksize=BLOCKSIZE,
        callback=callback,
    ):
        print("🎤 Microphone sẵn sàng.", flush=True)
        print("⏳ Chờ Tiểu Vũ nói xong rồi bắt đầu nghe.", flush=True)
        sent_bytes = 0

        while not shutdown_requested:
            data = await audio_queue.get()

            # Do not feed the microphone while Tiểu Vũ is producing her own
            # response. After turn_complete, listen_ready becomes True again.
            if not listen_ready or model_speaking:
                continue

            try:
                await session.send_realtime_input(
                    audio=types.Blob(data=data, mime_type="audio/pcm;rate=16000")
                )
                sent_bytes += len(data)
            except Exception as e:
                print("⚠️ MIC gửi audio lỗi:", repr(e), flush=True)
                continue

            if sent_bytes >= 32000:
                print(f"🎤 MIC → Gemini: {sent_bytes} bytes", flush=True)
                sent_bytes = 0

    stopped = True

'''

          s = s[:start] + new_microphone + s[end:]

          old_vad = '''        # Automatic VAD is deliberately disabled. microphone_sender owns the
        # activity_start/activity_end boundaries.
        realtime_input_config=types.RealtimeInputConfig(
            automatic_activity_detection=types.AutomaticActivityDetection(disabled=True)
        ),'''
          new_vad = '''        # Match the isolated microphone test: Gemini owns speech turn detection.
        realtime_input_config=types.RealtimeInputConfig(
            automatic_activity_detection=types.AutomaticActivityDetection(
                disabled=False,
                start_of_speech_sensitivity=types.StartSensitivity.START_SENSITIVITY_HIGH,
                end_of_speech_sensitivity=types.EndSensitivity.END_SENSITIVITY_LOW,
                prefix_padding_ms=100,
                silence_duration_ms=500,
            )
        ),'''
          if old_vad not in s:
              raise SystemExit("Expected Live VAD config not found; refusing to modify live_voice.py")
          s = s.replace(old_vad, new_vad, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify and commit
        run: |
          python -m py_compile live_voice.py
          git diff --check
          git add live_voice.py
          git rm .github/workflows/apply-live-input-rebuild.yml
          git commit -m "Apply Live Voice input transport rebuild"
          git push