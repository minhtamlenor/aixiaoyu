name: Fix Live Voice VAD

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-vad:
    if: "!contains(github.event.head_commit.message, 'Fix Live Voice VAD state')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix VAD state transition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('live_voice.py')
          s = p.read_text(encoding='utf-8')
          old = '''                if is_speech:\n                    speech_active = True\n                    speech_ms = chunk_ms\n                    silence_ms = 0\n                    listen_ready = False\n                    print("🟢 VAD: speech START", flush=True)'''
          new = '''                if is_speech:\n                    speech_active = True\n                    speech_ms = chunk_ms\n                    silence_ms = 0\n                    print("🟢 VAD: speech START", flush=True)'''
          if old not in s:
              raise SystemExit('Target VAD block not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_voice.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix Live Voice VAD state"
          git push