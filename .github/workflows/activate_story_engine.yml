name: Activate Buddhist Story Engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live_voice.py
        shell: python
        run: |
          from pathlib import Path
          path = Path("live_voice.py")
          text = path.read_text(encoding="utf-8")

          if "from story_engine import (" not in text:
              text = text.replace("import re\nimport unicodedata\n", "import re\nimport time\nimport unicodedata\n", 1)
              text = text.replace(
                  "from tools.calendar_tool import get_calendar_text\n",
                  "from tools.calendar_tool import get_calendar_text\nfrom story_engine import (\n    get_story_prompt,\n    is_story_request,\n    is_story_continue_request,\n    proactive_story_allowed,\n)\n",
                  1,
              )

          if "story_task = None" not in text:
              text = text.replace(
                  "shutdown_requested = False\nstartup_greeting_sent = False\n",
                  "shutdown_requested = False\nstartup_greeting_sent = False\nstory_task = None\nlast_user_activity = time.monotonic()\n",
                  1,
              )

          old = '''    print("\\n👤 Người nói:", text, flush=True)\n    if detect_farewell(text):'''
          new = '''    print("\\n👤 Người nói:", text, flush=True)\n\n    # Chat Mode: Buddhist Story Engine. Tutor Mode always wins.\n    global last_user_activity\n    last_user_activity = time.monotonic()\n    if not tutor_mode and is_story_request(text):\n        story_prompt = get_story_prompt(continuation=is_story_continue_request(text))\n        if story_prompt:\n            await send_text_command(session, story_prompt, 2)\n            return\n\n    if detect_farewell(text):'''
          if old in text and "Buddhist Story Engine. Tutor Mode always wins." not in text:
              text = text.replace(old, new, 1)

          marker = '''# ============================================================\n# LIVE CONFIG\n# ============================================================'''
          idle_block = '''# ============================================================\n# PROACTIVE STORYTELLING\n# ============================================================\nasync def proactive_story_loop(session):\n    """In Chat Mode, gently offer a Buddhist story after a quiet period."""\n    global last_user_activity\n    while not shutdown_requested:\n        try:\n            await asyncio.sleep(5)\n            if tutor_mode or model_speaking or not listen_ready:\n                continue\n            if not proactive_story_allowed(last_user_activity):\n                continue\n            prompt = get_story_prompt(proactive=True)\n            if not prompt:\n                continue\n            print("📖 Tiểu Vũ chủ động mở chuyện Phật giáo.", flush=True)\n            await send_text_command(session, prompt, 2)\n            last_user_activity = time.monotonic()\n        except asyncio.CancelledError:\n            return\n        except Exception as e:\n            print("⚠️ Proactive story lỗi:", repr(e), flush=True)\n\n\n'''
          if "async def proactive_story_loop" not in text:
              text = text.replace(marker, idle_block + marker, 1)

          old_run = '''async def run_one_connection():\n    global listen_ready, startup_greeting_sent\n    listen_ready = False\n    startup_greeting_sent = False'''
          new_run = '''async def run_one_connection():\n    global listen_ready, startup_greeting_sent, story_task, last_user_activity\n    listen_ready = False\n    startup_greeting_sent = False\n    last_user_activity = time.monotonic()'''
          if old_run in text:
              text = text.replace(old_run, new_run, 1)

          old_tasks = '''            receive_task = asyncio.create_task(receive_loop(session))\n            microphone_task = asyncio.create_task(microphone_sender(session))\n            await asyncio.sleep(0.25)\n            await send_startup_greeting(session)\n            await asyncio.gather(receive_task, microphone_task)'''
          new_tasks = '''            receive_task = asyncio.create_task(receive_loop(session))\n            microphone_task = asyncio.create_task(microphone_sender(session))\n            story_task = asyncio.create_task(proactive_story_loop(session))\n            await asyncio.sleep(0.25)\n            await send_startup_greeting(session)\n            await asyncio.gather(receive_task, microphone_task)'''
          if old_tasks in text and "story_task = asyncio.create_task(proactive_story_loop(session))" not in text:
              text = text.replace(old_tasks, new_tasks, 1)

          old_finally = '''    finally:\n        listen_ready = False\n        clear_speaker_queue()'''
          new_finally = '''    finally:\n        if story_task:\n            story_task.cancel()\n            try:\n                await story_task\n            except BaseException:\n                pass\n            story_task = None\n        listen_ready = False\n        clear_speaker_queue()'''
          if old_finally in text:
              text = text.replace(old_finally, new_finally, 1)

          path.write_text(text, encoding="utf-8")
          required = ["from story_engine import (", "async def proactive_story_loop(session):", "Buddhist Story Engine. Tutor Mode always wins."]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Patch incomplete: " + repr(missing))

      - name: Commit activation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_voice.py
          if git diff --cached --quiet; then
            echo "No live_voice.py changes needed."
          else
            git commit -m "Activate Buddhist Story Engine in Chat Mode"
            git push
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm -f .github/workflows/activate_story_engine.yml
          git commit -m "Remove one-time story engine activation workflow"
          git push
